on:
  schedule:
    # Run weekly on Sundays at 06:00 UTC
    - cron: '0 6 * * 0'
  workflow_dispatch:
    inputs:
      reason:
        description: 'Reason for manual run'
        required: false
        type: string

name: Integration Tests

permissions: read-all

jobs:
  integration-tests:
    runs-on: ubuntu-latest

    env:
      R_KEEP_PKG_SOURCE: yes
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      CENSUS_API_KEY: ${{ secrets.CENSUS_API_KEY }}
      RUN_INTEGRATION_TESTS: true

    steps:
      - uses: actions/checkout@v7

      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: 'release'
          use-public-rspm: true

      - name: Install Linux system dependencies for sf
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libgdal-dev libproj-dev libgeos-dev libudunits2-dev

      # Rotating weekly segment lets the tigris cache actually grow/refresh
      # instead of being pinned forever to the DESCRIPTION hash (#102 finding 4).
      - name: Get week number for cache rotation
        id: week
        run: echo "week=$(date +%V)" >> "$GITHUB_OUTPUT"

      - name: Cache tigris downloads
        uses: actions/cache@v6
        with:
          path: ~/.cache/R/tigris
          key: tigris-${{ hashFiles('DESCRIPTION') }}-${{ steps.week.outputs.week }}
          restore-keys: |
            tigris-${{ hashFiles('DESCRIPTION') }}-
            tigris-

      - name: Install Dependencies
        uses: r-lib/actions/setup-r-dependencies@v2
        with:
          cache: 'always'
          cache-version: 1
          extra-packages: any::testthat, any::rcmdcheck
          needs: check

      - name: Set tigris cache directory
        run: |
          mkdir -p ~/.cache/R/tigris
          echo 'options(tigris_use_cache = TRUE, tigris_cache_dir = "~/.cache/R/tigris")' >> ~/.Rprofile
        shell: bash

      - name: Run integration tests
        run: |
          testthat::test_local(reporter = testthat::SummaryReporter$new())
        shell: Rscript {0}
