on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

name: spelling

permissions: read-all

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  spelling:
    runs-on: ubuntu-latest
    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}

    steps:
      - uses: actions/checkout@v7

      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          cache: 'always'
          cache-version: 1
          extra-packages: any::spelling, local::.
          needs: spelling

      - name: Spell check
        run: |
          results <- spelling::spell_check_package()
          if (nrow(results) > 0) {
            print(results)
            stop("Spelling errors found. Add legitimate words to inst/WORDLIST.", call. = FALSE)
          }
          message("No spelling errors found.")
        shell: Rscript {0}
